<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Groupie Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <a href="index.html" class="logo">Groupie Tracker ~/</a>
        <div class="Searchbar">
            <form method="GET" action="/" id="search-form">
                <input type="text" name="filter" id="filter" autocomplete="off" placeholder="Rechercher un groupe...">
                <div id="suggestions" style="display: none;"></div>
            </form>
        </div>
    </header>

    <div class="title">
        <h1>Concerts de la semaine</h1>
    </div>

    <div style="text-align: center; margin: 20px;">
        <ifkrame width="560" height="315" src="https://www.youtube.com/embed/VIDEO_ID?autoplay=0" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>
    </div>
    
    <div class="card-container">
        <div class="card">
            <h2><a href="/artist/2">Coldplay</a></h2>
            <p>Un groupe de rock alternatif célèbre pour ses chansons épiques.</p>
        </div>
        <div class="card">
            <h2><a href="imagine.html">Imagine Dragons</a></h2>
            <p>Un groupe connu pour ses chansons énergiques et inspirantes.</p>
        </div>
        <div class="card">
            <h2><a href="muse.html">Muse</a></h2>
            <p>Un groupe de rock progressif et alternatif.</p>
        </div>
    </div>
</body>

<script>
    document.addEventListener("DOMContentLoaded", function() {
    const input = document.getElementById("filter");
    const suggestionsContainer = document.getElementById("suggestions");

    input.addEventListener("input", function() {
        const query = input.value.trim();
        
        if (query.length === 0) {
            suggestionsContainer.innerHTML = "";
            suggestionsContainer.style.display = "none"; // On cache la div
            return;
        }

        fetch(`/suggestions?q=${query}`)
            .then(response => response.json())
            .then(data => {
                suggestionsContainer.innerHTML = "";
                
                if (data.length === 0) {
                    suggestionsContainer.style.display = "none"; // Pas de résultat -> cacher
                    return;
                }

                data.forEach(artist => {
                    const div = document.createElement("div");
                    div.classList.add("suggestion-item");


                    div.addEventListener("mouseover", function() {
                        div.style.background = "#f0f0f0";
                    });
                    div.addEventListener("mouseout", function() {
                        div.style.background = "white";
                    });


                    const img = document.createElement("img");
                    img.src = artist.image;
                    img.alt = artist.name;
                    img.classList.add("suggestion-image");


                    const name = document.createElement("span");
                    name.textContent = artist.name;

                    div.appendChild(img);
                    div.appendChild(name);

                    div.addEventListener("click", function() {
                        input.value = artist.name;
                        suggestionsContainer.innerHTML = "";
                        suggestionsContainer.style.display = "none";
                        window.location.href = `/artist/${artist.id}`;
                    });

                    suggestionsContainer.appendChild(div);
                });

                suggestionsContainer.style.display = "block"; // Afficher la div si des résultats existent
            });
    });

    // Cacher les suggestions si on clique ailleurs
    document.addEventListener("click", function(e) {
        if (!input.contains(e.target) && !suggestionsContainer.contains(e.target)) {
            suggestionsContainer.innerHTML = "";
            suggestionsContainer.style.display = "none";
        }
    });
});
</script>
</html>
